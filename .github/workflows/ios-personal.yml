name: iPhone - pacote pessoal sem assinatura

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Selecionar Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Preparar o aplicativo
        run: |
          npm ci
          npm run mobile:sync
      - name: Compilar para iPhone
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DailyAPP.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Empacotar IPA sem assinatura
        run: |
          mkdir -p "$RUNNER_TEMP/dailyapp-ipa/Payload" artifacts
          ditto "$RUNNER_TEMP/DailyAPP.xcarchive/Products/Applications/App.app" \
            "$RUNNER_TEMP/dailyapp-ipa/Payload/App.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/dailyapp-ipa/Payload" \
            "$GITHUB_WORKSPACE/artifacts/DailyAPP-1.3-sem-assinatura.ipa"
      - name: Disponibilizar pacote para assinatura pessoal
        uses: actions/upload-artifact@v4
        with:
          name: DailyAPP-iPhone-sem-assinatura
          path: artifacts/DailyAPP-1.3-sem-assinatura.ipa
          if-no-files-found: error
          retention-days: 7
